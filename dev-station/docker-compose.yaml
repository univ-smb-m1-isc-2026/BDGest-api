version: "3.9"

services:
  postgres-local:
    image: postgres:16-alpine
    container_name: postgres-local
    restart: always

    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: db_bd

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backup_db.sql:/docker-entrypoint-initdb.d/2-backup.sql

volumes:
  postgres-data: