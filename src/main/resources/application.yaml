spring:
  application:
    name: BDGest-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/db_bd}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
      properties:
        hibernate.connection.useUnicode: true
        hibernate.connection.characterEncoding: UTF-8
        hibernate.connection.charSet: UTF-8
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  app:
    jwt:
      secret: ${JWT_SECRET:thisIsMysecregtfrdesww233eggtffeeddgkjjhhtdhttebd54ndhdhfhhhshs8877465sbbdd}
      expiration: ${JWT_EXPIRATION_TIME:86400000} # 24h

    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://bd.oups.net}

server:
  port: 8080